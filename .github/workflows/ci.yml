name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      # Smoke-test the standalone bundle the CLI ships with.
      - name: Pack and verify CLI
        run: |
          npm pack --json > pack.json
          tarball=$(node -e "console.log(require('./pack.json')[0].filename)")
          mkdir _verify && cd _verify
          npm init -y >/dev/null
          npm install --no-save "../$tarball"
          ./node_modules/.bin/cclog --version
